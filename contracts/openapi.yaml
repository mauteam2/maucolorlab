          - passport_id
          - test
          properties:
            client_id:
              type: string
              format: uuid
            passport_id:
              type: string
              format: uuid
            test:
              $ref: '#/components/schemas/HairPhysicalTest'
    HairPhysicalTestRpcRequest:
      type: object
      additionalProperties: false
      required:
      - p_membership_id
      - p_location_id
      - p_client_id
      - p_payload
      properties:
        p_membership_id:
          type: string
          format: uuid
        p_location_id:
          type: string
          format: uuid
        p_client_id:
          type: string
          format: uuid
        p_payload:
          $ref: '#/components/schemas/HairAddPhysicalTestRequest'
        p_correlation_id:
          type: string
          format: uuid
    HairHistoryEvidenceInput:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          enum: [HISTORICAL, IMPORTED_UNVERIFIED]
        confidence:
          $ref: '#/components/schemas/HairConfidence'
        context:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 2000
            pattern: \S
          - type: 'null'
      description: Historical provenance only. Observation time remains UNKNOWN because date precision is represented on the event. Caller cannot provide verifier, actor, location, timestamps, relevance or supersedes fields.
    HairAddHistoryRequest:
      type: object
      additionalProperties: false
      required: [request_id, category, performed_on, product, description, evidence]
      properties:
        request_id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/HairHistoryCategory'
        performed_on:
          $ref: '#/components/schemas/HairHistoryDate'
        product:
          $ref: '#/components/schemas/HairProduct'
        description:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        region_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Empty or omitted means whole hair. Duplicate supplied IDs are accepted once and the result is sorted.
        location_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        attributed_salon:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 160
            pattern: \S
          - type: 'null'
        attributed_professional:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 160
            pattern: \S
          - type: 'null'
        evidence:
          $ref: '#/components/schemas/HairHistoryEvidenceInput'
      description: Append-only history input. Ownership and recording actor/time are derived server-side. Date precision and product unknown/not-applicable states are preserved without inference. No correction or risk interpretation is created.
    HairAddHistoryCommand:
      type: object
      additionalProperties: false
      required: [operation, client_id, payload]
      properties:
