          - VERIFIED_ALLOWED
          - VERIFIED_RESTRICTED
          - NOT_RECOMMENDED
          - INCOMPATIBLE
          - UNKNOWN
        reason:
          type: string
          minLength: 1
          maxLength: 500
        source:
          $ref: '#/components/schemas/BrandTechnicalSource'
        sourceReference:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
        verifiedBy:
          anyOf:
          - type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          - type: 'null'
        verifiedAt:
          anyOf:
          - type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          - type: 'null'
        conditions:
          maxItems: 3
          type: array
          items:
            type: string
            enum:
            - NO_LIFT
            - NO_GREY_COVERAGE
            - STANDARD_REGION_ONLY
        restrictions:
          maxItems: 10
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        mixingRatio:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 200
      required:
      - id
      - catalogId
      - version
      - productId
      - developerId
      - technique
      - applicationContext
      - outcome
      - reason
      - source
      - sourceReference
      - verifiedBy
      - verifiedAt
      - conditions
      - restrictions
      - mixingRatio
      additionalProperties: false
      allOf:
      - if:
          properties:
            outcome:
              enum:
              - VERIFIED_ALLOWED
              - VERIFIED_RESTRICTED
        then:
          properties:
            source:
              enum:
              - MANUFACTURER_DOCUMENTATION
              - ELIFORA_EXPERT_VALIDATED
              - SALON_VALIDATED
            sourceReference:
              type: string
              minLength: 1
            verifiedBy:
              type: string
              format: uuid
            verifiedAt:
              type: string
              format: date-time
      - if:
          properties:
            outcome:
              const: VERIFIED_RESTRICTED
        then:
          anyOf:
          - properties:
              conditions:
                minItems: 1
          - properties:
              restrictions:
                minItems: 1
