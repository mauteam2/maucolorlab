        '403':
          description: Anonymous/forbidden role; provider envelope
  /api/clients/{clientId}/hair-passport/tests:
    post:
      operationId: addClientHairPhysicalTest
      summary: Record a live physical test and its provenance
      description: Requires fresh selected membership with hair_passport.add_test, clients.read and hair_passport.read.
        Same-origin JSON, workspace reference, 32768-byte body limit and no query parameters. Append test, physical
        evidence, audit and existing 24-hour receipt in one transaction. Same organization/actor/request_id and payload
        replay original data with current correlation ID; changed payload/context/operation conflicts. Authorization
        and active parent/location/region are checked before replay. After 24-hour expiry the same request may append
        a new fact. No expected_version is needed because no assessment pointer or mutable version changes. Existing
        paginated GET exposes the test. Responses are private, no-store; matching X-Correlation-ID is server-generated.
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Workspace-Reference
        required: true
        schema:
          type: string
        description: Selected membership:location precondition; fresh server membership remains the authority.
      - in: header
        name: Origin
        required: true
        schema:
          type: string
          format: uri
        description: Must exactly match application origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HairAddPhysicalTestRequest'
      responses:
        '200':
          description: Committed mutation result or successful retry
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HairAddPhysicalTestResult'
        '400':
          $ref: '#/components/responses/AccessError'
        '401':
          $ref: '#/components/responses/AccessError'
        '403':
          $ref: '#/components/responses/AccessError'
        '404':
          $ref: '#/components/responses/AccessError'
        '409':
          $ref: '#/components/responses/AccessError'
        '503':
          $ref: '#/components/responses/AccessError'
  /rest/v1/rpc/hair_physical_test_operation:
    post:
      operationId: addHairPhysicalTestRpc
      summary: Authenticated live physical-test recording RPC
      description: SECURITY INVOKER wrapper delegates to the existing NOLOGIN/NOBYPASSRLS writer. Selected add_test
        permission and active ownership are checked again after the organization advisory lock and before receipt
        replay. Performer is auth.uid(), performed time is statement_timestamp(). Evidence is PHYSICAL_TEST with known
        observed time, unknown confidence and no verifier. Logical errors use ErrorResponse in HTTP 200. Explicit
        null correlation is invalid; omission uses the call-site UUID default.
      servers:
      - url: http://127.0.0.1:54321
      security:
      - bearerAuth: []
        publishableKey: []
      requestBody:
        required: true
        content:
