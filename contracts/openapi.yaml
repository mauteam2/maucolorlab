    HairPhysicalTestPage:
      type: "object"
      additionalProperties: false
      required: ["items","offset","page_size","has_more","next_offset"]
      properties:
        items:
          type: "array"
          maxItems: 100
          items:
            $ref: "#/components/schemas/HairPhysicalTest"
        offset:
          type: "integer"
          minimum: 0
          maximum: 10000
        page_size:
          type: "integer"
          minimum: 1
          maximum: 100
        has_more:
          type: "boolean"
        next_offset:
          anyOf:
            -
              type: "integer"
              minimum: 1
              maximum: 10100
            -
              type: "null"
      description: "has_more uses one lookahead row. next_offset equals offset + page_size when has_more, otherwise null. At most page_size items. Offsets are bounded to 10000; each request reads a fresh snapshot, so concurrent appends can shift subsequent pages."
    HairHistoryPage:
      type: "object"
      additionalProperties: false
      required: ["items","offset","page_size","has_more","next_offset"]
      properties:
        items:
          type: "array"
