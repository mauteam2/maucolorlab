      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: photoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: client_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Workspace-Reference
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Immutable photo upload recorded and audited
        default:
          description: Structured error; max 10 MiB; metadata must be reserved first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSessionError'
  /rest/v1/rpc/live_session_store:
    post:
      operationId: persistSignedLiveSession
      security:
      - bearerAuth: []
        publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveSessionStoreRequest'
      responses:
        '200':
          description: JWT, signature, membership, version and critical dependency validation result
  /rest/v1/rpc/live_session_clock:
    post:
      operationId: liveSessionClock
      security:
      - bearerAuth: []
        publishableKey: []
      responses:
        '200':
          description: Authenticated database clock; no client elapsed authority
          content:
            application/json:
              schema:
                type: string
                format: date-time
  /rest/v1/rpc/live_session_transfer_allowed:
    post:
      operationId: liveSessionTransferAllowed
      security:
      - bearerAuth: []
        publishableKey: []
      responses:
        '200':
          description: Fresh database membership/control permission in the current salon location
          content:
            application/json:
              schema:
                type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_user_id
              - p_organization_id
              - p_location_id
              properties:
                p_user_id:
                  type: string
                  format: uuid
                p_organization_id:
                  type: string
                  format: uuid
                p_location_id:
                  type: string
                  format: uuid
              additionalProperties: false
  /rest/v1/rpc/live_session_receipt:
    post:
      operationId: liveSessionReceipt
      security:
      - bearerAuth: []
        publishableKey: []
      responses:
        '200':
          description: Actor-scoped exact-input receipt; rechecks active location/membership; null when absent
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LiveSession'
                - $ref: '#/components/schemas/LiveSessionError'
                - type: 'null'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - p_membership_id
              - p_location_id
              - p_mutation_id
              - p_input
              - p_session_id
              - p_correlation_id
              properties:
                p_membership_id:
                  type: string
                  format: uuid
                p_location_id:
                  type: string
                  format: uuid
                p_mutation_id:
                  type: string
                  format: uuid
                p_input:
                  oneOf:
                  - $ref: '#/components/schemas/CreateLiveSession'
                  - $ref: '#/components/schemas/LiveSessionCommand'
                p_session_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                p_correlation_id:
                  type: string
                  format: uuid
              additionalProperties: false

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    publishableKey:
      type: apiKey
      in: header
      name: apikey
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-project-ref-auth-token
      description: Supabase SSR cookie name depends on project ref; may be chunked.
  responses:
    AccessError:
      description: Stable failure; only duplicate review may include authorized masked candidates
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    CorrelationId:
      description: Identifier used to trace one operation without exposing sensitive data.
      schema:
        type: string
        format: uuid
  schemas:
    RiskBand:
      type: string
      enum:
      - LOW
      - MODERATE
      - HIGH
      - CRITICAL
    RiskDimension:
      type: string
      enum:
      - HAIR_INTEGRITY
      - CHEMICAL_HISTORY
      - LIGHTENING_HISTORY
      - REGIONAL_COMPLEXITY
      - POROSITY_ELASTICITY
      - EVIDENCE_INFORMATION
      - PHYSICAL_TEST_SUFFICIENCY
      - TECHNICAL_CONSISTENCY
    SafetyGateOutcome:
      type: string
      enum:
      - CONTINUE_TECHNICAL_PLANNING
      - CONTINUE_WITH_CHECKPOINTS
      - REQUIRE_ADDITIONAL_ASSESSMENT
      - REQUIRE_PHYSICAL_TEST
      - REQUIRE_STRAND_TEST
      - BLOCK_INSUFFICIENT_INFORMATION
      - REQUIRE_RECOVERY_REASSESSMENT
      - BLOCK_TECHNICAL_PLANNING
      - OUTSIDE_COSMETIC_SCOPE
    RiskReasonCode:
      type: string
      enum:
      - NO_ESCALATING_STRUCTURED_FACT
      - HIGH_POROSITY_EVIDENCE
      - LOW_ELASTICITY_EVIDENCE
      - COMBINED_INTEGRITY_CONCERN
      - INTEGRITY_INFORMATION_UNKNOWN
      - LIGHTENING_HISTORY_PRESENT
      - REPEATED_LIGHTENING_HISTORY
      - LIGHTENING_HISTORY_UNKNOWN
      - CHEMICAL_HISTORY_PRESENT
      - CHEMICAL_HISTORY_COMPLEX
      - CHEMICAL_HISTORY_UNKNOWN
      - HISTORY_UNVERIFIED
      - REGIONAL_VARIATION_HIGH
      - REGION_INFORMATION_MISSING
      - PHYSICAL_TEST_MISSING
      - PHYSICAL_TEST_STALE
      - PHYSICAL_TEST_UNRELIABLE
      - CONFLICTING_INTEGRITY_EVIDENCE
      - CONFLICTING_TECHNICAL_EVIDENCE
      - CONFIDENCE_LOW
      - CONFIDENCE_MODERATE
      - CONFIDENCE_INSUFFICIENT
      - CRITICAL_INFORMATION_GAP
      - ADDITIONAL_INFORMATION_REQUIRED
      - OUTSIDE_COSMETIC_SCOPE
    RiskReason:
      type: object
      additionalProperties: false
      required:
      - code
      - dimension
      - band
      - target
      - field
      - evidenceRefs
      - context
      properties:
        code:
          $ref: '#/components/schemas/RiskReasonCode'
        dimension:
          $ref: '#/components/schemas/RiskDimension'
        band:
          $ref: '#/components/schemas/RiskBand'
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        field:
          $ref: '#/components/schemas/ConfidenceField'
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
        context:
          type: object
          additionalProperties: false
          required:
          - state
          - value
          - count
          properties:
            state:
              type:
              - string
              - 'null'
            value:
              type:
              - string
              - number
              - 'null'
            count:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 1000
    DimensionRisk:
      type: object
      additionalProperties: false
      required:
      - dimension
      - band
      - reasons
      properties:
        dimension:
          $ref: '#/components/schemas/RiskDimension'
        band:
          $ref: '#/components/schemas/RiskBand'
        reasons:
          type: array
          minItems: 0
          maxItems: 2000
          items:
            $ref: '#/components/schemas/RiskReason'
    RegionalRisk:
      type: object
      additionalProperties: false
      required:
      - target
      - band
      - dimensions
      properties:
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        band:
          $ref: '#/components/schemas/RiskBand'
        dimensions: &id002
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/DimensionRisk'
    SafetyGate:
      type: object
      additionalProperties: false
      allOf:
      - if:
          properties:
            outcome:
              enum: [CONTINUE_TECHNICAL_PLANNING, CONTINUE_WITH_CHECKPOINTS]
        then:
          properties:
            canProgress: {const: true}
        else:
          properties:
            canProgress: {const: false}
      required:
      - outcome
      - canProgress
      - reasonCodes
      properties:
        outcome:
          $ref: '#/components/schemas/SafetyGateOutcome'
        canProgress:
          type: boolean
        reasonCodes:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/RiskReasonCode'
    HardStop:
      type: object
      additionalProperties: false
      required:
      - outcome
      - reasonCodes
      - target
      - evidenceRefs
      properties:
        outcome:
          $ref: '#/components/schemas/SafetyGateOutcome'
        reasonCodes:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/RiskReasonCode'
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
    RequiredPhysicalTest:
      type: object
      additionalProperties: false
      required:
      - type
      - target
      - status
      - reasonCodes
      - evidenceRefs
      properties:
        type:
          type: string
          enum:
          - POROSITY
          - ELASTICITY
          - STRAND
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        status:
          type: string
          enum:
          - SATISFIED
          - MISSING
          - STALE
          - UNRELIABLE
        reasonCodes:
          type: array
          minItems: 0
          maxItems: 30
          items:
            $ref: '#/components/schemas/RiskReasonCode'
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
    RiskInformationRequirement:
      type: object
      additionalProperties: false
      required:
      - code
      - target
      - severity
      - reasonCodes
      - evidenceRefs
      properties:
        code:
          type: string
          enum:
          - ASSESS_NATURAL_LEVEL
          - ASSESS_CURRENT_LEVEL
          - ASSESS_GREY
          - ASSESS_POROSITY
          - ASSESS_ELASTICITY
          - ASSESS_INTEGRITY
          - VERIFY_COLOR_HISTORY
          - VERIFY_BLEACH_HISTORY
          - VERIFY_CHEMICAL_HISTORY
          - PERFORM_STRAND_TEST
          - VERIFY_REGION
          - REVIEW_CONFLICTING_EVIDENCE
          - VERIFY_IMPORTED_HISTORY
          - REFRESH_EVIDENCE
          - PERFORM_POROSITY_TEST
          - PERFORM_ELASTICITY_TEST
          - REASSESS_HAIR_INTEGRITY
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        severity:
          $ref: '#/components/schemas/RiskBand'
        reasonCodes:
          type: array
          minItems: 0
          maxItems: 40
          items:
            anyOf:
            - $ref: '#/components/schemas/RiskReasonCode'
            - $ref: '#/components/schemas/ConfidenceReasonCode'
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
    RiskConfidenceRelationship:
      type: object
      additionalProperties: false
      required:
      - engineVersion
      - inputFingerprint
      - rulesFingerprint
      - band
      - confidence
      properties:
        engineVersion:
          type: string
          const: confidence-engine/1.0.0
        inputFingerprint: &id001
          type: string
          pattern: ^[a-f0-9]{64}$
        rulesFingerprint: *id001
        band:
          $ref: '#/components/schemas/ConfidenceBand'
        confidence:
          $ref: '#/components/schemas/ConfidenceScore'
    RiskAssessment:
      type: object
      additionalProperties: false
      required:
      - engineVersion
      - evaluatedAt
      - inputFingerprint
      - rulesFingerprint
      - passportId
      - passportVersion
      - overallBand
      - dimensions
      - regions
      - gate
      - hardStops
      - requiredPhysicalTests
      - requiredInformation
      - dominantReasons
      - confidence
      - scopeAssessment
      properties:
        engineVersion:
          type: string
          const: risk-engine/1.0.0
        evaluatedAt:
          type: string
          format: date-time
        inputFingerprint: *id001
        rulesFingerprint: *id001
        passportId:
          type: string
          format: uuid
        passportVersion:
          type: integer
          minimum: 1
        overallBand:
          $ref: '#/components/schemas/RiskBand'
        dimensions: *id002
        regions:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/RegionalRisk'
        gate:
          $ref: '#/components/schemas/SafetyGate'
        hardStops:
          type: array
          minItems: 0
          maxItems: 2000
          items:
            $ref: '#/components/schemas/HardStop'
        requiredPhysicalTests:
          type: array
          minItems: 0
          maxItems: 303
          items:
            $ref: '#/components/schemas/RequiredPhysicalTest'
        requiredInformation:
          type: array
          minItems: 0
          maxItems: 5000
          items:
            $ref: '#/components/schemas/RiskInformationRequirement'
        dominantReasons:
          type: array
          minItems: 0
          maxItems: 5000
          items:
            $ref: '#/components/schemas/RiskReason'
        confidence:
          $ref: '#/components/schemas/RiskConfidenceRelationship'
        scopeAssessment:
          type: string
          enum:
          - NOT_ASSESSED
          - DECLARED_OUTSIDE_COSMETIC_SCOPE
    RiskResult:
      type: object
      additionalProperties: false
      required:
      - data
      - correlationId
      properties:
        data:
          $ref: '#/components/schemas/RiskAssessment'
        correlationId:
          type: string
          format: uuid
    ConfidenceBand:
      type: string
      enum: [HIGH, MEDIUM, LOW, INSUFFICIENT]
    ConfidenceDomain:
      type: string
      enum: [LEVEL, GREY, INTEGRITY, COSMETIC_COLOR_HISTORY, BLEACH_HISTORY, CHEMICAL_HISTORY, REGIONAL_COVERAGE, PHYSICAL_TEST]
    UncertaintySeverity:
      type: string
      description: Materiality of information gaps, never damage or service risk.
      enum: [LOW, MODERATE, HIGH, CRITICAL]
    ConfidenceScore:
      type: number
      minimum: 0
      maximum: 1
      description: Canonical information-quality summary; use bands or whole percentages in later UI.
    ConfidenceField:
      type: [string, 'null']
      enum: [natural_level, perceived_level, grey_ratio, porosity, elasticity, thickness, density, cosmetic_color_history, bleach_history, chemical_history, physical_test, null]
    ConfidenceTarget:
      type: string
      pattern: '^(GLOBAL|MISSING:(ROOT|MID_LENGTHS|ENDS)|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
    ConfidenceReasonCode:
      type: string
      enum: [FIELD_NOT_ASSESSED, FIELD_UNKNOWN, EVIDENCE_STALE, EVIDENCE_EXPIRED, EVIDENCE_TIME_UNKNOWN, LOW_QUALITY_EVIDENCE, SOURCE_QUALITY_LIMIT, CONFIDENCE_UNSPECIFIED, EXPLICIT_CONFIDENCE_LIMIT, CONFLICTING_EVIDENCE, DIVERGENT_HISTORY_SUMMARIES, REGION_NOT_ASSESSED, HISTORY_UNVERIFIED, PHYSICAL_TEST_MISSING, CRITICAL_INFORMATION_GAP]
    ConfidenceEvidenceRef:
      type: object
      additionalProperties: false
      required: [kind, id, evidenceId]
      properties:
        kind: {type: string, enum: [OBSERVATION, PHYSICAL_TEST, HISTORY, UNVERIFIED_STATE]}
        id: {type: string, format: uuid}
        evidenceId: {type: [string, 'null'], format: uuid}
    ConfidenceEvidenceRefs:
      type: array
      maxItems: 1000
      items:
        $ref: '#/components/schemas/ConfidenceEvidenceRef'
    FieldConfidence:
      type: object
      additionalProperties: false
      required: [field, target, state, confidence, evidenceRefs, reasons, freshness]
      properties:
        field:
          allOf:
            - $ref: '#/components/schemas/ConfidenceField'
            - type: string
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        state: {type: string, enum: [KNOWN, UNKNOWN, NOT_ASSESSED, NOT_APPLICABLE]}
        confidence:
          $ref: '#/components/schemas/ConfidenceScore'
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
        reasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConfidenceReasonCode'
        freshness: {type: string, enum: [FRESH, STALE, EXPIRED, UNKNOWN, HISTORICAL]}
    DomainConfidence:
      type: object
      additionalProperties: false
      required: [domain, confidence, band, fields]
      properties:
        domain:
          $ref: '#/components/schemas/ConfidenceDomain'
        confidence:
          $ref: '#/components/schemas/ConfidenceScore'
        band:
          $ref: '#/components/schemas/ConfidenceBand'
        fields:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FieldConfidence'
    UncertaintyItem:
      type: object
      additionalProperties: false
      required: [domain, field, target, severity, code, state, evidenceRefs]
      properties:
        domain:
          $ref: '#/components/schemas/ConfidenceDomain'
        field:
          $ref: '#/components/schemas/ConfidenceField'
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        severity:
          $ref: '#/components/schemas/UncertaintySeverity'
        code:
          $ref: '#/components/schemas/ConfidenceReasonCode'
        state: {type: [string, 'null'], enum: [KNOWN, UNKNOWN, NOT_ASSESSED, NOT_APPLICABLE, null]}
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
    EvidenceConflict:
      type: object
      additionalProperties: false
      required: [domain, field, target, severity, code, evidenceRefs]
      properties:
        domain:
          $ref: '#/components/schemas/ConfidenceDomain'
        field:
          allOf:
            - $ref: '#/components/schemas/ConfidenceField'
            - type: string
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        severity:
          $ref: '#/components/schemas/UncertaintySeverity'
        code: {type: string, enum: [CONFLICTING_EVIDENCE, DIVERGENT_HISTORY_SUMMARIES]}
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
    InformationRequirement:
      type: object
      additionalProperties: false
      required: [code, domain, field, target, severity, reasonCodes, evidenceRefs]
      properties:
        code:
          type: string
          enum: [ASSESS_NATURAL_LEVEL, ASSESS_CURRENT_LEVEL, ASSESS_GREY, ASSESS_POROSITY, ASSESS_ELASTICITY, ASSESS_INTEGRITY, VERIFY_COLOR_HISTORY, VERIFY_BLEACH_HISTORY, VERIFY_CHEMICAL_HISTORY, PERFORM_STRAND_TEST, VERIFY_REGION, REVIEW_CONFLICTING_EVIDENCE, VERIFY_IMPORTED_HISTORY, REFRESH_EVIDENCE]
        domain:
          $ref: '#/components/schemas/ConfidenceDomain'
        field:
          $ref: '#/components/schemas/ConfidenceField'
        target:
          $ref: '#/components/schemas/ConfidenceTarget'
        severity:
          $ref: '#/components/schemas/UncertaintySeverity'
        reasonCodes:
          type: array
          items:
            $ref: '#/components/schemas/ConfidenceReasonCode'
        evidenceRefs:
          $ref: '#/components/schemas/ConfidenceEvidenceRefs'
    EngineVersion:
      type: string
      pattern: '^confidence-engine/[0-9]+\.[0-9]+\.[0-9]+$'
    EngineVersionMetadata:
      type: object
      required: [engineVersion, evaluatedAt, inputFingerprint, rulesFingerprint]
      properties:
        engineVersion:
          $ref: '#/components/schemas/EngineVersion'
        evaluatedAt: {type: string, format: date-time}
        inputFingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        rulesFingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
    CaseConfidenceAssessment:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EngineVersionMetadata'
        - type: object
          required: [confidence, band, domains, significantUnknowns, conflicts, staleEvidence, informationRequirements, passportId, passportVersion, inputCounts]
          properties:
            confidence:
              $ref: '#/components/schemas/ConfidenceScore'
            band:
              $ref: '#/components/schemas/ConfidenceBand'
            domains:
              type: array
              minItems: 8
              maxItems: 8
              items:
                $ref: '#/components/schemas/DomainConfidence'
            significantUnknowns:
              type: array
              items:
                $ref: '#/components/schemas/UncertaintyItem'
            conflicts:
              type: array
              items:
                $ref: '#/components/schemas/EvidenceConflict'
            staleEvidence:
              type: array
              items:
                $ref: '#/components/schemas/UncertaintyItem'
            informationRequirements:
              type: array
              items:
                $ref: '#/components/schemas/InformationRequirement'
            passportId: {type: string, format: uuid}
            passportVersion: {type: integer, minimum: 1, maximum: 9007199254740991}
            inputCounts:
              type: object
              additionalProperties: false
              required: [regions, observations, physicalTests, history]
              properties:
                regions: {type: integer, minimum: 0, maximum: 100}
                observations: {type: integer, minimum: 0, maximum: 1101}
                physicalTests: {type: integer, minimum: 0, maximum: 1000}
                history: {type: integer, minimum: 0, maximum: 1000}
    CaseConfidenceResult:
      type: object
      additionalProperties: false
      required: [data, correlationId]
      properties:
        data:
          $ref: '#/components/schemas/CaseConfidenceAssessment'
        correlationId: {type: string, format: uuid}
    ConfidenceEvaluationInput:
      type: object
      additionalProperties: false
      required: [pages, evaluatedAt]
      properties:
        evaluatedAt: {type: string, format: date-time}
        pages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/HairPassportSnapshot'
    ConfidenceSnapshotRequest:
      type: object
      additionalProperties: false
      required: [p_membership_id, p_location_id, p_client_id]
      properties:
        p_membership_id: {type: string, format: uuid}
        p_location_id: {type: string, format: uuid}
        p_client_id: {type: string, format: uuid}
        p_include_archived: {type: boolean, default: false}
        p_correlation_id: {type: string, format: uuid}
    HairThickness:
      type: "string"
      enum: ["FINE","MEDIUM","COARSE"]
    HairDensity:
      type: "string"
      enum: ["LOW","MEDIUM","HIGH"]
    HairPorosity:
      type: "string"
      enum: ["LOW","MEDIUM","HIGH"]
    HairElasticity:
      type: "string"
      enum: ["LOW","NORMAL","HIGH"]
    HairRegionType:
      type: "string"
      enum: ["ROOT","MID_LENGTHS","ENDS","FACE_FRAME","CROWN","NAPE","BANDED_AREA","BLEACHED_AREA","HIGHLIGHTED_AREA","CUSTOM"]
    HairEvidenceSource:
      type: "string"
      enum: ["AI_ESTIMATE","PROFESSIONAL_VERIFIED","PHYSICAL_TEST","HISTORICAL","IMPORTED_UNVERIFIED"]
    HairTestType:
      type: "string"
      enum: ["POROSITY","ELASTICITY","STRAND"]
    HairHistoryCategory:
      type: "string"
      enum: ["COLOR","BLEACH_LIGHTENING","TONER_GLOSS","PERM","RELAXER_STRAIGHTENING","KERATIN_SMOOTHING","OTHER_CHEMICAL"]
    HairLevelField:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "KNOWN"
            value:
              type: "number"
              minimum: 1
              maximum: 10
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "NOT_ASSESSED"
            value:
              type: "null"
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "UNKNOWN"
            value:
              type: "null"
    HairRatioField:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "KNOWN"
            value:
              type: "number"
              minimum: 0
              maximum: 1
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
