        state/value results; bare strings, missing values and contradictory states are invalid. Phase 1C-1 defines bounded
        textual facts for KNOWN, not per-test outcome enums. No safety interpretation. Optional location must be an
        accessible active same-organization location; omission uses selected workspace. Performer, ownership, timestamps
        and PHYSICAL_TEST evidence are server-derived. No correction, import or observation is created.
    HairAddPhysicalTestCommand:
      type: object
      additionalProperties: false
      required:
      - operation
      - client_id
      - payload
      properties:
        operation:
          const: add_physical_test
        client_id:
          type: string
          format: uuid
        payload:
          $ref: '#/components/schemas/HairAddPhysicalTestRequest'
    HairAddPhysicalTestResult:
      type: object
