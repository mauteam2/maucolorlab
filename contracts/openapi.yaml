    patch:
      operationId: updateClientHairRegion
      summary: updateClientHairRegion
      description: 'Server-only core mutation with fresh selected workspace authorization. JSON body is limited to 32768 bytes;
        no query parameters. Caller ownership metadata is rejected. request_id is scoped to organization and actor for 24 hours:
        identical retry returns original data; changed request returns CONFLICT. Updates require expected_version. Archived
