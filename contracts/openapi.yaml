              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HairMutationResult'
        '400':
          $ref: '#/components/responses/AccessError'
        '401':
          $ref: '#/components/responses/AccessError'
        '403':
          $ref: '#/components/responses/AccessError'
        '404':
          $ref: '#/components/responses/AccessError'
        '409':
          $ref: '#/components/responses/AccessError'
        '503':
          $ref: '#/components/responses/AccessError'
  /api/clients/{clientId}/hair-passport/regions/{regionId}:
    patch:
      operationId: updateClientHairRegion
      summary: updateClientHairRegion
      description: 'Server-only core mutation with fresh selected workspace authorization. JSON body is limited to 32768 bytes;
        no query parameters. Caller ownership metadata is rejected. request_id is scoped to organization and actor for 24 hours:
        identical retry returns original data; changed request returns CONFLICT. Updates require expected_version. Archived
        clients return CLIENT_ARCHIVED, archived passports reject writes, archived regions return HAIR_REGION_NOT_FOUND. All
        HTTP responses are private, no-store with matching body/header correlation IDs. No evidence, observation, physical-test
        or history writes.'
      security:
      - sessionCookie: []
      parameters:
