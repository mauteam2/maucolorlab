openapi: 3.1.0
info:
  title: ELIFORA Service API
  version: 0.14.0
  description: |
    ELIFORA authentication, verified workspace, and organization client identity.
    Auth uses Supabase Auth. Every client operation revalidates membership and
    permission server-side, with RLS in depth. No tenancy creation is exposed.
servers:
  - url: /
    description: ELIFORA web origin.
paths:
  /api/session:
    get:
      operationId: getVerifiedWorkspace
      summary: Revalidate auth and the selected workspace
      description: |
        Uses Supabase session cookies. Reads fresh membership results on every request.
        Responses are private, no-store. Returns no protected context on failure.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Verified selected context
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                required: [context, correlationId]
                properties:
                  context:
                    $ref: '#/components/schemas/ActiveTenantContext'
                  correlationId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/AccessError'
        '403':
          $ref: '#/components/responses/AccessError'
        '503':
          $ref: '#/components/responses/AccessError'
  /rest/v1/rpc/list_workspace_contexts:
    post:
      operationId: listWorkspaceContexts
      summary: Read the authenticated user's usable organization/location memberships
      servers:
        - url: http://127.0.0.1:54321
          description: Disposable local Supabase; configure environment origin for staging.
      description: |
        Direct Supabase PostgREST RPC with no parameters. SECURITY INVOKER and RLS.
        Organization-wide memberships expand to active locations. Organizations with
        no active locations return no usable context. Permissions come from role_permissions.
        Supabase/PostgREST transport errors are normalized by the platform adapters;
        the raw provider response does not implement the ELIFORA ErrorResponse envelope.
      security:
        - bearerAuth: []
          publishableKey: []
      responses:
        '200':
          description: Only the caller's active memberships in accessible active locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveTenantContext'
        '401':
          description: Missing or expired Supabase JWT
        '403':
          description: Anonymous or forbidden role
  /api/clients:
    post:
      operationId: executeWebClientCommand
      parameters:
        - in: header
          name: X-Workspace-Reference
          required: false
          description: |
            Mandatory for create/update/archive/restore. The membership_id:location_id
            from the form's verified context must match the freshly selected workspace.
            Prevents another tab changing the destination of an open form. This is only
            a precondition, never evidence of authorization. Mismatch/missing is
            TENANT_CONTEXT_INVALID with no mutation.
          schema:
            type: string
      summary: List, search, create, read, update, archive or restore clients
      description: |
        Same-origin JSON request using session cookies. The server resolves the
        selected workspace cookie against fresh memberships; scope is never accepted
        in the command. Every response is private, no-store with X-Correlation-ID.
        list defaults ACTIVE, 25 rows; offset maximum 10000, limit maximum 50.
        detail explicitly retrieves active or archived identity. Mutations require
        request_id; update/archive/restore also require expected_version.
        Phone is a non-unique signal. TR national formats and international +/00
        country-code formats are normalized. Other national regions require explicit
        country codes. Format validation does not verify number ownership or carrier.
        Duplicate review includes active and archived same-organization candidates,
        at most 10 masked summaries, using exact phone/name/email or birth date with
        name prefix. A 10-minute single-use token binds actor, selected membership,
        location, operation, exact payload and candidate versions. Submit unchanged
        fields/request_id plus confirmation_token after explicit separate-person
        review. Expired/changed reviews must be requested again without the token.
        Never auto-merge. Successful retries of the identical request_id and payload
        return the original result for 24 hours without another write/audit event.
        Reusing the key for a different payload returns CONFLICT. Retrying an uncertain
        mutation must retain its request_id, including confirmation_token if present.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCommand'
      responses:
        '200':
          description: Client result plus freshly verified context
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ClientResult'
                  - type: object
                    required: [context]
                    properties:
                      context:
                        $ref: '#/components/schemas/ActiveTenantContext'
        '400':
          $ref: '#/components/responses/AccessError'
        '401':
          $ref: '#/components/responses/AccessError'
        '403':
          $ref: '#/components/responses/AccessError'
        '404':
          $ref: '#/components/responses/AccessError'
        '409':
          description: Duplicate review, invalid confirmation, version conflict or archived client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/AccessError'
  /rest/v1/rpc/client_operation:
    post:
      operationId: executeNativeClientCommand
      summary: Authenticated client service RPC used by Android and the Web server
      servers:
        - url: http://127.0.0.1:54321
          description: Disposable local Supabase; never connect development to production.
      description: |
        p_membership_id/p_location_id are untrusted selection references. The service
        derives organization, actor and permissions from current database membership.
        Public wrapper is SECURITY INVOKER; private service uses a NOLOGIN NOBYPASSRLS
        non-table-owner role. Authenticated users have no direct client mutation grants.
        Same semantics as /api/clients. Logical errors use HTTP 200 with ErrorResponse
        so duplicate-review issuance commits without writing a client. Native adapter
        distinguishes data from code; Web adapter maps logical errors to HTTP statuses.
        PostgREST transport errors are normalized separately by adapters. RPC correlation
        is in the body (p_correlation_id), independent of gateway transport headers.
      security:
        - bearerAuth: []
          publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRpcCommand'
      responses:
        '200':
          description: Logical client result or stable domain error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ClientResult'
                  - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or expired JWT (provider envelope)
        '403':
          description: Anonymous or forbidden role (provider envelope)
  /api/clients/{clientId}/hair-passport:
    get:
      operationId: "getClientHairPassport"
      summary: "Read an authorized organization client technical snapshot"
      description: "Read-only server adapter. Session and selected workspace cookie are freshly verified; no organization or passport ID is accepted. Responses, including failures, are private, no-store with matching body/header correlation IDs. Current whole-hair and regional assessments include their evidence; the independent observations page includes earlier append-only records. Test and history pages are independent. Archived clients/passports require include_archived=true; otherwise their respective NOT_FOUND error is returned. This GET remains read-only. UNVERIFIED values are mutable core state and carry no evidence claim."
      security:
        -
          sessionCookie: []
      parameters:
        -
          in: "path"
          name: "clientId"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          in: "query"
          name: "include_archived"
          required: false
          schema:
            type: "boolean"
            default: false
            description: "Explicit historical access to an archived client or passport; authorization remains mandatory."
        -
          in: "query"
          name: "page_size"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 50
        -
          in: "query"
          name: "observations_offset"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 10000
            default: 0
        -
          in: "query"
          name: "tests_offset"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 10000
            default: 0
        -
          in: "query"
          name: "history_offset"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: "Validated technical snapshot with explicit states and provenance"
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HairPassportReadResult"
        '400':
          $ref: "#/components/responses/AccessError"
        '401':
          $ref: "#/components/responses/AccessError"
        '403':
          $ref: "#/components/responses/AccessError"
        '404':
          $ref: "#/components/responses/AccessError"
        '503':
          $ref: "#/components/responses/AccessError"
    post:
      operationId: createClientHairPassport
      summary: createClientHairPassport
      description: 'Server-only core mutation with fresh selected workspace authorization. JSON body is limited to 32768 bytes;
        no query parameters. Caller ownership metadata is rejected. request_id is scoped to organization and actor for 24 hours:
        identical retry returns original data; changed request returns CONFLICT. Updates require expected_version. Archived clients
        return CLIENT_ARCHIVED, archived passports reject writes, archived regions return HAIR_REGION_NOT_FOUND. All HTTP responses
        are private, no-store with matching body/header correlation IDs. No evidence, observation, physical-test or history writes.'
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Workspace-Reference
        required: true
        schema:
          type: string
        description: Selected membership:location precondition; fresh server membership remains the authority.
      - in: header
        name: Origin
        required: true
        schema:
          type: string
          format: uri
        description: Must exactly match application origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HairCreatePassportRequest'
      responses:
        '200':
          description: Committed mutation result or successful retry
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HairMutationResult'
        '400':
          $ref: '#/components/responses/AccessError'
        '401':
          $ref: '#/components/responses/AccessError'
        '403':
          $ref: '#/components/responses/AccessError'
        '404':
          $ref: '#/components/responses/AccessError'
        '409':
          $ref: '#/components/responses/AccessError'
        '503':
          $ref: '#/components/responses/AccessError'
    patch:
      operationId: updateClientHairPassportCore
      summary: updateClientHairPassportCore
      description: 'Server-only core mutation with fresh selected workspace authorization. JSON body is limited to 32768 bytes;
        no query parameters. Caller ownership metadata is rejected. request_id is scoped to organization and actor for 24 hours:
        identical retry returns original data; changed request returns CONFLICT. Updates require expected_version. Archived clients
        return CLIENT_ARCHIVED, archived passports reject writes, archived regions return HAIR_REGION_NOT_FOUND. All HTTP responses
        are private, no-store with matching body/header correlation IDs. No evidence, observation, physical-test or history writes.'
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Workspace-Reference
        required: true
        schema:
          type: string
        description: Selected membership:location precondition; fresh server membership remains the authority.
      - in: header
        name: Origin
        required: true
        schema:
          type: string
          format: uri
        description: Must exactly match application origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HairUpdatePassportRequest'
      responses:
        '200':
          description: Committed mutation result or successful retry
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HairMutationResult'
        '400':
          $ref: '#/components/responses/AccessError'
        '401':
          $ref: '#/components/responses/AccessError'
        '403':
          $ref: '#/components/responses/AccessError'
        '404':
          $ref: '#/components/responses/AccessError'
        '409':
          $ref: '#/components/responses/AccessError'
        '503':
          $ref: '#/components/responses/AccessError'
  /rest/v1/rpc/hair_passport_snapshot:
    post:
      operationId: "readHairPassportSnapshotRpc"
      summary: "Read-only authenticated Hair Passport service RPC"
      servers:
        -
          url: "http://127.0.0.1:54321"
          description: "Disposable local Supabase; configure environment origin for staging."
      description: "SECURITY INVOKER, stable and RLS-protected. Membership and location are selection references, never authority. Verifies the selected membership owner, active organization/location and that selected role has hair_passport.read. Existing clients.read RLS must also authorize client lookup. Organization is derived from membership; client/passport IDs cannot cross tenants. No mutation or audit write occurs. Logical errors use the shared ErrorResponse in HTTP 200. Native consumers must validate the read model and normalize provider errors separately; RPC correlation is carried in p_correlation_id and the response body."
      security:
        -
          bearerAuth: []
          publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HairPassportRpcRequest"
      responses:
        '200':
          description: "Technical snapshot or shared logical error"
          content:
            application/json:
              schema:
                oneOf:
                  -
                    $ref: "#/components/schemas/HairPassportReadResult"
                  -
                    $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: "Missing/expired JWT; provider envelope"
        '403':
          description: "Anonymous/forbidden role; provider envelope"
