        '404':
          $ref: '#/components/responses/AccessError'
        '409':
          $ref: '#/components/responses/AccessError'
        '503':
          $ref: '#/components/responses/AccessError'
  /rest/v1/rpc/hair_core_operation:
    post:
      operationId: mutateHairCoreRpc
      summary: Four authenticated core mutations behind the existing internal RLS writer role
      description: Public SECURITY INVOKER wrapper delegates to the existing NOLOGIN NOBYPASSRLS hair writer. Selected membership,
        role permission, location, active organization and client are rechecked after the organization lock and before receipt
        replay. Organization is never caller supplied. Logical errors use ErrorResponse in HTTP 200; provider authorization
        errors are normalized separately. Creation requires hair_passport.create; other operations require hair_passport.update.
        Existing hair_passport.read and clients.read RLS remain prerequisites. Correlation defaults to a generated UUID when
        omitted; explicit null is invalid.
      servers:
      - url: http://127.0.0.1:54321
      security:
      - bearerAuth: []
        publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HairCoreRpcRequest'
      responses:
        '200':
          description: Mutation or stable logical error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HairMutationResult'
                - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/expired JWT; provider envelope
        '403':
          description: Anonymous/forbidden role; provider envelope
  /api/clients/{clientId}/hair-passport/observations:
    post:
      operationId: addClientHairObservation
      summary: Atomically append a technical observation and its evidence
      description: 'Server-only JSON mutation using fresh selected membership and hair_passport.add_observation. Requires clients.read
        and hair_passport.read for parent access and result mapping. Same-origin and X-Workspace-Reference checks, 32768-byte
        limit and no query parameters match core mutations. Observation, evidence, target selection, audit and receipt commit
        atomically. Reuses existing organization/actor/request_id 24-hour receipts: same request replays original data with
        current correlation; changed payload or stale target version returns CONFLICT. Current authorization and parent lifecycle
        are checked before replay. Client/passport/region archive errors match core mutation behavior. Responses are private,
        no-store. No standalone evidence, test or history write endpoint.'
      security:
      - sessionCookie: []
      parameters:
      - in: path
        name: clientId
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Workspace-Reference
        required: true
        schema:
          type: string
        description: Selected membership:location precondition; fresh server membership remains the authority.
      - in: header
        name: Origin
        required: true
        schema:
          type: string
          format: uri
        description: Must exactly match application origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HairAddObservationRequest'
      responses:
        '200':
          description: Committed mutation result or successful retry
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HairAddObservationResult'
        '400':
          $ref: '#/components/responses/AccessError'
        '401':
          $ref: '#/components/responses/AccessError'
        '403':
          $ref: '#/components/responses/AccessError'
        '404':
          $ref: '#/components/responses/AccessError'
        '409':
          $ref: '#/components/responses/AccessError'
        '503':
          $ref: '#/components/responses/AccessError'
  /rest/v1/rpc/hair_observation_operation:
    post:
      operationId: addHairObservationRpc
      summary: Authenticated observation/evidence service RPC
      description: SECURITY INVOKER wrapper delegates to the existing NOLOGIN/NOBYPASSRLS writer. Ownership derives from selected
        membership and client/passport, never caller metadata. Membership permission is rechecked after the organization lock
        and before retry replay. add_observation permits only selecting this statement's new immutable observation; it does
        not grant core editing. Logical errors use ErrorResponse in HTTP 200. No AI provider calls. Explicit null correlation
        is invalid; omitted correlation uses the database call-site UUID default.
      servers:
      - url: http://127.0.0.1:54321
      security:
      - bearerAuth: []
        publishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HairObservationRpcRequest'
      responses:
        '200':
          description: Mutation or stable logical error
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HairAddObservationResult'
                - $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing/expired JWT; provider envelope
        '403':
          description: Anonymous/forbidden role; provider envelope
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    publishableKey:
      type: apiKey
      in: header
      name: apikey
    sessionCookie:
      type: apiKey
      in: cookie
      name: sb-project-ref-auth-token
      description: Supabase SSR cookie name depends on project ref; may be chunked.
  responses:
    AccessError:
      description: Stable failure; only duplicate review may include authorized masked candidates
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    CorrelationId:
      description: Identifier used to trace one operation without exposing sensitive data.
      schema:
        type: string
        format: uuid
  schemas:
    HairThickness:
      type: "string"
      enum: ["FINE","MEDIUM","COARSE"]
    HairDensity:
      type: "string"
      enum: ["LOW","MEDIUM","HIGH"]
    HairPorosity:
      type: "string"
      enum: ["LOW","MEDIUM","HIGH"]
    HairElasticity:
      type: "string"
      enum: ["LOW","NORMAL","HIGH"]
    HairRegionType:
      type: "string"
      enum: ["ROOT","MID_LENGTHS","ENDS","FACE_FRAME","CROWN","NAPE","BANDED_AREA","BLEACHED_AREA","HIGHLIGHTED_AREA","CUSTOM"]
    HairEvidenceSource:
      type: "string"
      enum: ["AI_ESTIMATE","PROFESSIONAL_VERIFIED","PHYSICAL_TEST","HISTORICAL","IMPORTED_UNVERIFIED"]
    HairTestType:
      type: "string"
      enum: ["POROSITY","ELASTICITY","STRAND"]
    HairHistoryCategory:
      type: "string"
      enum: ["COLOR","BLEACH_LIGHTENING","TONER_GLOSS","PERM","RELAXER_STRAIGHTENING","KERATIN_SMOOTHING","OTHER_CHEMICAL"]
    HairLevelField:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "KNOWN"
            value:
              type: "number"
              minimum: 1
              maximum: 10
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "NOT_ASSESSED"
            value:
              type: "null"
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "UNKNOWN"
            value:
              type: "null"
    HairRatioField:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "KNOWN"
            value:
              type: "number"
              minimum: 0
              maximum: 1
        -
          type: "object"
          additionalProperties: false
          required: ["state","value"]
          properties:
            state:
              const: "NOT_ASSESSED"
            value:
              type: "null"
        -
          type: "object"
          additionalProperties: false
