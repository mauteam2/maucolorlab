name: ELIFORA Pass1 protected staging verification
on:
  push:
    branches: [codex/pass1-hosted-verification]
permissions:
  contents: read
concurrency:
  group: pass1-staging-hosted-smoke
  cancel-in-progress: false
env:
  UI_SHA: 20e88edb563354765d594272a45ad07cbfe9ecdf
  UI_CI: '40558445185'
jobs:
  candidate:
    name: Protected candidate browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UI_BYPASS: ${{ secrets.ELIFORA_PASS1_BYPASS }}
      UI_EMAIL: ${{ secrets.ELIFORA_PASS1_EMAIL }}
      UI_PASSWORD: ${{ secrets.ELIFORA_PASS1_PASSWORD }}
      UI_OTHER_EMAIL: ${{ secrets.ELIFORA_PASS1_OTHER_EMAIL }}
      UI_OTHER_PASSWORD: ${{ secrets.ELIFORA_PASS1_OTHER_PASSWORD }}
      UI_MODE: candidate
      UI_ORIGIN: https://elifora-staging-1529lonfv-elifora.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Verify exact UI release against protected hosted staging
        run: node scripts/verify-pass1-hosted.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-ui-pass1-candidate
          path: |
            apps/web/captures/reports/pass1-hosted-candidate-*.png
            apps/web/captures/reports/pass1-staging-*.json
          retention-days: 14
  canonical:
    name: Protected canonical browser checks
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UI_BYPASS: ${{ secrets.ELIFORA_PASS1_BYPASS }}
      UI_EMAIL: ${{ secrets.ELIFORA_PASS1_EMAIL }}
      UI_PASSWORD: ${{ secrets.ELIFORA_PASS1_PASSWORD }}
      UI_OTHER_EMAIL: ${{ secrets.ELIFORA_PASS1_OTHER_EMAIL }}
      UI_OTHER_PASSWORD: ${{ secrets.ELIFORA_PASS1_OTHER_PASSWORD }}
      UI_MODE: canonical
      UI_ORIGIN: https://elifora-staging.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Wait for guarded alias promotion and verify canonical application
        run: node scripts/verify-pass1-hosted.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-ui-pass1-canonical
          path: |
            apps/web/captures/reports/pass1-hosted-canonical-*.png
            apps/web/captures/reports/pass1-staging-*.json
          retention-days: 14
