name: ELIFORA verification

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: phase-0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-ci-publishable-key
      ELIFORA_DEPLOYMENT_ENV: development
      ELIFORA_RELEASE_SHA: ${{ github.sha }}
      ELIFORA_RELEASE_VERSION: pilot.0.10.0
      ELIFORA_RELEASE_CI_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Configure disposable browser-test auth request budget
        working-directory: .
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ.get("CI") == "true"
          path = Path("supabase/config.toml")
          config = path.read_text()
          assert 'project_id = "elifora"' in config
          # Both browser projects share localhost. Keep real Auth/RLS enforcement,
          # but allow their finite synthetic request batch in this disposable job.
          for original, temporary in (("sign_in_sign_ups = 30", "sign_in_sign_ups = 1000"), ("token_refresh = 150", "token_refresh = 1000")):
              assert config.count(original) == 1
              config = config.replace(original, temporary)
          path.write_text(config)
          PY
      - run: |
          python scripts/configure-disposable-supabase-ports.py
          python scripts/start-local-supabase.py
          python scripts/configure-disposable-saas.py
        working-directory: .
      - name: Configure disposable local auth tests
        working-directory: .
        run: |
          supabase status -o json > "$RUNNER_TEMP/elifora-supabase-status.json"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "elifora-supabase-status.json"
          status = json.loads(path.read_text())
          if status["API_URL"] != "http://127.0.0.1:54321":
              raise RuntimeError("Disposable local Supabase required")
          key = subprocess.check_output(["docker", "exec", "supabase_db_elifora", "psql", "-U", "postgres", "-Atc",
              "select encode(secret,'hex') from app_private.color_engine_keys where id=1"], text=True).strip()
          print("::add-mask::" + key)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=" + status["ANON_KEY"] + "\n")
              env.write("ELIFORA_TEST_STATUS_FILE=" + str(path) + "\n")
              env.write("ELIFORA_COLOR_PLAN_SIGNING_KEY=" + key + "\n")
          PY
      - run: npm run lint
      - run: npm run typecheck
      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npm run build
      - run: node scripts/verify-browser-bundle.mjs
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: Live execution cockpit must pass without retries
        run: npx playwright test e2e/live-cockpit.spec.ts --workers=1 --retries=0 --output=test-results-pass4
      - name: Retain authenticated Live cockpit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-productization-pass-4
          path: |
            apps/web/test-results-pass4/**/pass4-*.png
            apps/web/test-results-pass4/**/pass4-*.json
            apps/web/test-results-pass4/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Global catalog discovery and regional non-execution must pass without retries
        run: npx playwright test e2e/color-registry.spec.ts --workers=1 --retries=0
      - name: Professional workspace layouts and preserved sign-in intro must pass without retries
        run: npx playwright test e2e/design-deepening.spec.ts e2e/visual-productization.spec.ts e2e/colorlab-productization.spec.ts e2e/dossier-productization.spec.ts e2e/sign-in-intro.spec.ts --workers=1 --retries=0 --output=test-results-design
      - name: Retain focused visual acceptance before longer regression journeys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-productization-pass-1
          path: |
            apps/web/test-results-design/**/ui-ux-pass1-*.png
            apps/web/test-results-design/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain authenticated ColorLab Pass 2 acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-productization-pass-2
          path: |
            apps/web/test-results-design/**/ui-ux-pass2-*.png
            apps/web/test-results-design/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain authenticated Client Profile and Hair Passport Pass 3 acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-productization-pass-3
          path: |
            apps/web/test-results-design/**/ui-ux-pass3-*.png
            apps/web/test-results-design/**/ui-ux-pass3-*.json
            apps/web/test-results-design/**/error-context.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Redesigned client navigation and salon interactions must pass without retries
        run: npx playwright test e2e/clients.spec.ts e2e/client-crm.spec.ts e2e/salon-operations.spec.ts --workers=1 --retries=0
      - name: Phase 8 offline browser journeys must pass without retries
        run: npx playwright test e2e/offline.spec.ts --workers=1 --retries=0
      - name: Phase 9 security journeys must pass without retries
        run: npx playwright test e2e/security.spec.ts --workers=1 --retries=0
      - name: ColorLab expanded targets and verified controlled recipe must pass without retries
        run: npx playwright test e2e/color-pilot.spec.ts e2e/controlled-recipe.spec.ts --workers=1 --retries=0
      - name: Retain governed disposable controlled formulation capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-productization-pass-2-formulation
          path: apps/web/test-results/**/ui-ux-pass2-controlled-formulation-1440.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Phase 5B browser journeys must pass without retries
        run: npx playwright test e2e/costing.spec.ts e2e/controlled-recipe.spec.ts --workers=1 --retries=0
      - name: Phase 10 empty-tenant pilot workflow and private feedback must pass without retries
        run: npx playwright test e2e/pilot-readiness.spec.ts --workers=1 --retries=0
      - name: Phase 6 report journeys must pass without retries
        run: npx playwright test e2e/reporting.spec.ts --workers=1 --retries=0
      - name: Phase 7 SaaS journeys must pass without retries
        run: npx playwright test e2e/saas.spec.ts --workers=1 --retries=0
      - run: npm run test:e2e
      - name: Phase 8 production browser reliability — ten consecutive repetitions, no retries
        run: npx playwright test --config=playwright.reliability.config.ts
      - name: Verify retained Phase 8 diagnostics, measurements and first-pass evidence
        working-directory: .
        run: python scripts/verify-phase-8-evidence.py
      - name: Client UI verification captures (synthetic local fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-ui-verification
          path: |
            apps/web/test-results/**/client-*.png
            apps/web/test-results/**/error-context.md
            apps/web/test-results/**/client-live-performance.json
            apps/web/test-results/**/stock-*.png
            apps/web/test-results/**/finance-*.png
            apps/web/test-results/**/costing-*.png
            apps/web/test-results/**/reporting-*.png
            apps/web/test-results/**/saas-*.png
            apps/web/test-results/**/phase-8-*.png
            apps/web/test-results/**/phase-9-*.png
            apps/web/test-results/**/phase-9-*.json
            apps/web/test-results/**/color-pilot-*.png
            apps/web/test-results/**/ui-ux-pass2-*.png
            apps/web/test-results/**/color-pilot-*.json
            apps/web/test-results/**/phase-10-*.png
            apps/web/test-results/**/phase-10-*.json
            apps/web/test-results/**/global-catalog-*.png
            apps/web/test-results/**/ui-ux-*.png
            apps/web/test-results-design/**/ui-ux-*.png
            apps/web/test-results-design/**/error-context.md
            ${{ runner.temp }}/color-pilot-*.json
            apps/web/test-results/**/phase-8-*.json
            apps/web/test-results/**/sanitized-route-*.json
            apps/web/test-results/**/reliability-summary.json
            apps/web/test-results-reliability/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Small sanitized browser diagnostics and measurement archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8-browser-diagnostics
          path: |
            apps/web/test-results/**/phase-8-*.json
            apps/web/test-results/**/phase-9-*.json
            apps/web/test-results/**/color-pilot-*.json
            apps/web/test-results/**/phase-10-*.json
            ${{ runner.temp }}/color-pilot-*.json
            apps/web/test-results/**/sanitized-route-*.json
            apps/web/test-results/**/reliability-summary.json
            apps/web/test-results-reliability/**/sanitized-route-*.json
            apps/web/test-results-reliability/**/reliability-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        working-directory: .
        run: supabase stop --no-backup

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Report executed Android unit tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          assert reports, "Android unit test reports missing"
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in reports:
              suite = ElementTree.parse(report).getroot()
              for name in totals:
                  totals[name] += int(suite.attrib.get(name, "0"))
          assert totals["tests"] > 0 and totals["failures"] == totals["errors"] == 0
          print("Android unit results:", totals)
          print("Instrumentation APK compiled; device tests are not executed by this job.")
          PY

  database:
    name: Database and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: |
          python scripts/configure-disposable-supabase-ports.py
          python scripts/start-local-supabase.py
          python scripts/configure-disposable-saas.py
      - run: supabase db lint --local --fail-on warning
      - name: Review actual migrated function owners, grants and RLS
        run: python scripts/verify-security-database.py
      - run: supabase test db
      - name: Global discovery intake races retain conditional versions
        run: python scripts/test-color-registry-concurrency.py
      - name: Global catalog concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-catalog-database-verification
          path: ${{ runner.temp }}/global-catalog-concurrency.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Phase 9 security concurrency barriers
        run: |
          supabase db reset --local
          python scripts/configure-disposable-saas.py
          python scripts/test-phase-9-concurrency.py
          supabase db reset --local
          python scripts/configure-disposable-saas.py
      - name: Phase 10 admission lock and rollback barriers
        run: python scripts/test-pilot-concurrency.py
      - name: Phase 10 admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-10-database-verification
          path: ${{ runner.temp }}/phase-10-*.json
          if-no-files-found: error
          retention-days: 7
      - name: Phase 9 actual database security and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-9-database-security
          path: ${{ runner.temp }}/phase-9-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Phase 8 durable replay, offline intent and controller recovery races
        run: |
          supabase db reset --local
          python scripts/configure-disposable-saas.py
          python scripts/test-phase-8-concurrency.py
          supabase db reset --local
          python scripts/configure-disposable-saas.py
      - name: SaaS real PostgreSQL quota, usage and provider races
        run: python scripts/test-saas-concurrency.py
      - name: Gate 1 real PostgreSQL concurrency barriers
        run: |
          supabase db reset --local
          python scripts/configure-disposable-saas.py
          python scripts/test-gate-1-concurrency.py
      - name: Stock real PostgreSQL concurrency and 10k movement performance
        run: |
          # Each real-connection harness commits synthetic catalog fixtures.
          # Start stock races from a fresh disposable local schema after Gate 1.
          supabase db reset --local
          python scripts/configure-disposable-saas.py
          python scripts/test-stock-concurrency.py
      - name: Stock database verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-database-verification
          path: ${{ runner.temp }}/stock-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Finance real PostgreSQL concurrency and 10k financial facts
        run: |
          supabase db reset --local
          python scripts/configure-disposable-saas.py
          python scripts/test-finance-concurrency.py
      - name: Finance database verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-database-verification
          path: ${{ runner.temp }}/finance-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Costing real PostgreSQL concurrency and 10k contribution facts
        run: |
          supabase db reset --local
          python scripts/configure-disposable-saas.py
          python scripts/test-costing-concurrency.py
      - name: Costing database verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costing-database-verification
          path: ${{ runner.temp }}/costing-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Reporting real PostgreSQL races and 50k source-derived projections
        run: |
          supabase db reset --local
          python scripts/configure-disposable-saas.py
          python scripts/test-reporting-concurrency.py
      - name: Reporting database verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-database-verification
          path: ${{ runner.temp }}/reporting-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: SaaS database verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saas-database-verification
          path: ${{ runner.temp }}/saas-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Phase 8 PostgreSQL recovery and durable replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-8-database-verification
          path: ${{ runner.temp }}/phase-8-concurrency-performance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  contracts-and-secrets:
    name: Contracts and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/verification-requirements.txt
      - run: python scripts/validate-contract.py
      - run: python scripts/verify-global-catalog.py
      - run: python scripts/test-global-catalog-intake.py
      - run: python scripts/security_inventory.py
      - run: python scripts/test-security-inventory.py
      - run: python scripts/test-start-local-supabase.py
      - run: python scripts/test-configure-disposable-supabase-ports.py
      - run: python scripts/test-check-catalog-sources.py
      - run: python scripts/test-pilot-readiness.py
      - run: pip install -r scripts/recovery-requirements.txt
      - run: python scripts/test-pilot-backup.py
      - run: python scripts/pilot_readiness.py queue contracts/pilot-document-review-queue.json
      - name: Scan repository history for secrets
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --dir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .
        env:
          GH_TOKEN: ${{ github.token }}
      - run: git diff --check
